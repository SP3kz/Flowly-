name: Build & Test Flowly Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Zip Extension Files
        run: |
          cd extension
          zip -r ../flowly-extension-v1.zip *

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v3
        with:
          name: flowly-extension
          path: flowly-extension-v1.zip
